[project]
name = "controller-lab"
version = "0.1.0"
description = "A guided controller tester for Windows that gives an honest verdict per controller."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "aakarsh" }]
requires-python = ">=3.11"
dependencies = [
    "pygame-ce>=2.5.8",
    "numpy",
    "matplotlib",
]

[project.scripts]
controller-lab = "controller_lab.__main__:main"

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/controller_lab"]
# Ship the profile TOML files that live inside the package.
include = [
    "src/controller_lab/**/*.py",
    "src/controller_lab/profiles/*.toml",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
