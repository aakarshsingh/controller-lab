# Fallback thresholds for any controller without its own profile. They copy the Xbox
# Series values, which are not calibrated for other controllers, so results carry a
# "reference not calibrated" note.

version = 2
name = "Generic"
calibrated = false
bluetooth_bad_ratio = 1.5

[weights]
left_stick = 25
right_stick = 20
triggers = 15
buttons = 15
dpad = 5
connection = 20

[loop]
median_ms = 1.5
p99_ms = 4.0

[auto_fail]
idle_offset_pct = 8.0
settle_offset_pct = 12.0
chatter = 0
hold_dropouts = 0
usb_max_gap_ms = 100.0
bluetooth_drop = true

# Gamepadla, Xbox Series over USB, borrowed as a rough USB reference.
[reference.usb]
mean_ms = 8.3
max_ms = 12.2
rate_hz = 111.0

# Gamepadla, Xbox Series over Bluetooth, borrowed. Context only: Bluetooth is judged against
# other controllers on the same PC.
[reference.bluetooth]
mean_ms = 13.0
max_ms = 20.9

[deadzones]
left = 7849
right = 8689

